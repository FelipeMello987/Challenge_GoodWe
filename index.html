<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampera</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>⚡ Ampera</h1>
    <input id="a-nome" type="text" placeholder="Nome" style="display:none">
    <input id="a-email" type="text" placeholder="Email">
    <input id="a-pass" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')Auth.enviar()">
    <button id="a-btn" onclick="Auth.enviar()">Entrar</button>
    <div id="login-error"></div>
    <div class="alt" id="a-alt" onclick="Auth.alternar()">Não tem conta? Criar conta</div>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text"><b>Ampera</b><span>INTELLIGENCE</span></div>
    </div>
    <button id="nav-dashboard" class="active" onclick="UI.navegar('dashboard')">Dashboard</button>
    <button id="nav-mapa" onclick="UI.navegar('mapa')">Mapa</button>
    <div class="user"><span id="user-nome"></span><button onclick="Auth.sair()">Sair</button></div>
  </div>
  <div id="main">
    <div id="topbar">
      <div>Visão: <select id="filtro" onchange="UI.filtrar(this.value)"></select></div>
      <div class="live"><span class="dot"></span>AO VIVO <span id="clock" style="color:#94a3b8"></span></div>
    </div>
    <div id="alerta"></div>
    <div id="content"></div>
  </div>
</div>

<div id="modal-bg">
  <div id="modal">
    <h3 id="m-titulo">Cadastrar carregador</h3>
    <input id="f-nome" placeholder="Nome do carregador">
    <input id="f-potencia" type="number" min="1" placeholder="Potência (kW)">
    <select id="f-status">
      <option value="1">Ativo (carregando)</option>
      <option value="0">Offline</option>
    </select>
    <div id="f-erro"></div>
    <div class="modal-btns">
      <button class="cancel" onclick="UI.fecharModal()">Cancelar</button>
      <button class="save" onclick="UI.salvar()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/grafico.js"></script>
<script src="js/mapa.js"></script>
<script src="js/ia.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
